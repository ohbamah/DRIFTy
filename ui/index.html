<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DRIFTy</title>
  <script>try { const t = localStorage.getItem("drifty.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="stylesheet" href="/ui/css/app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Navigation"></aside>
    <main id="view" class="view"></main>
    <button class="icon-btn sb-reopen" id="sb-reopen" title="Afficher la barre" aria-label="Afficher la barre"></button>
  </div>
  <template id="mark-tpl"><span class="mark"><svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="mk-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262a31"/><stop offset="1" stop-color="#0b0d10"/></linearGradient>
            <linearGradient id="mk-skid" x1="4" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffc21a" stop-opacity="0"/><stop offset="0.55" stop-color="#ffc21a" stop-opacity="0.85"/><stop offset="1" stop-color="#ffc21a"/></linearGradient>
          </defs>
          <rect width="40" height="40" rx="11" fill="url(#mk-bg)"/>
          <path d="M5 24.5C14 24 23.5 20.8 31.5 11.5" fill="none" stroke="url(#mk-skid)" stroke-width="4.6" stroke-linecap="round"/>
          <path d="M8 32.5C17 32 26.5 28.8 34.5 19.5" fill="none" stroke="url(#mk-skid)" stroke-width="4.6" stroke-linecap="round"/>
        </svg></span></template>
  <div id="tip" class="tip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/ui/js/main.js"></script>
</body>
</html>
