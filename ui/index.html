<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claudius</title>
  <script>try { const t = localStorage.getItem("claudius.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="stylesheet" href="/ui/css/app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Navigation"></aside>
    <main id="view" class="view"></main>
    <button class="icon-btn sb-reopen" id="sb-reopen" title="Afficher la barre" aria-label="Afficher la barre"></button>
  </div>
  <template id="mark-tpl"><span class="mark"><svg viewBox="0 0 40 40" aria-hidden="true">
          <defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs>
          <rect width="40" height="40" rx="12" fill="url(#mk)"/>
          <path d="M27.5 13.2A10 10 0 1 0 27.5 26.8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
          <g fill="#f5b83d">
            <ellipse cx="11.6" cy="14.4" rx="1.9" ry="3.4" transform="rotate(-40 11.6 14.4)"/>
            <ellipse cx="9.6" cy="20" rx="1.9" ry="3.4"/>
            <ellipse cx="11.6" cy="25.6" rx="1.9" ry="3.4" transform="rotate(40 11.6 25.6)"/>
          </g>
        </svg></span></template>
  <div id="tip" class="tip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/ui/js/main.js"></script>
</body>
</html>
