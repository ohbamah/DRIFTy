[package]
name = "drifty-app"
version = "0.1.0"
edition = "2021"
description = "DRIFTy : application macOS (coquille Tauri autour de driftyd)"

# Projet indépendant du workspace racine : il ne recompile pas le démon et
# le workspace racine (cargo test) ne le voit pas.
[workspace]

[[bin]]
name = "drifty-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
