<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>DRIFTy</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f8; --ink: #1f2328; --muted: #6b7280; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17181b; --ink: #e6e7ea; --muted: #8b8f98; } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-user-select: none; cursor: default; }
    .box { text-align: center; max-width: 520px; padding: 0 24px; }
    svg { width: 64px; height: 64px; }
    p { color: var(--muted); margin: 14px 0 0; }
    #err { color: #dc2626; white-space: pre-wrap; text-align: left; font: 12px/1.5 ui-monospace, Menlo, monospace; }
  </style>
</head>
<body data-tauri-drag-region>
  <div class="box" data-tauri-drag-region>
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs>
      <rect width="40" height="40" rx="12" fill="url(#mk)"/>
      <path d="M27.5 13.2A10 10 0 1 0 27.5 26.8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
      <g fill="#f5b83d">
        <ellipse cx="11.6" cy="14.4" rx="1.9" ry="3.4" transform="rotate(-40 11.6 14.4)"/>
        <ellipse cx="9.6" cy="20" rx="1.9" ry="3.4"/>
        <ellipse cx="11.6" cy="25.6" rx="1.9" ry="3.4" transform="rotate(40 11.6 25.6)"/>
      </g>
    </svg>
    <p id="msg">Démarrage du démon…</p>
    <p id="err" hidden></p>
  </div>
</body>
</html>
