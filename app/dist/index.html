<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>DRIFTy</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f8; --ink: #1f2328; --muted: #6b7280; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17181b; --ink: #e6e7ea; --muted: #8b8f98; } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-user-select: none; cursor: default; }
    .box { text-align: center; max-width: 520px; padding: 0 24px; }
    svg { width: 64px; height: 64px; }
    p { color: var(--muted); margin: 14px 0 0; }
    #err { color: #dc2626; white-space: pre-wrap; text-align: left; font: 12px/1.5 ui-monospace, Menlo, monospace; }
  </style>
</head>
<body data-tauri-drag-region>
  <div class="box" data-tauri-drag-region>
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <defs>
        <linearGradient id="mk-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262a31"/><stop offset="1" stop-color="#0b0d10"/></linearGradient>
        <linearGradient id="mk-skid" x1="4" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffc21a" stop-opacity="0"/><stop offset="0.55" stop-color="#ffc21a" stop-opacity="0.85"/><stop offset="1" stop-color="#ffc21a"/></linearGradient>
      </defs>
      <rect width="40" height="40" rx="11" fill="url(#mk-bg)"/>
      <path d="M5 24.5C14 24 23.5 20.8 31.5 11.5" fill="none" stroke="url(#mk-skid)" stroke-width="4.6" stroke-linecap="round"/>
      <path d="M8 32.5C17 32 26.5 28.8 34.5 19.5" fill="none" stroke="url(#mk-skid)" stroke-width="4.6" stroke-linecap="round"/>
    </svg>
    <p id="msg">Démarrage de DRIFTy…</p>
    <p id="err" hidden></p>
  </div>
</body>
</html>
